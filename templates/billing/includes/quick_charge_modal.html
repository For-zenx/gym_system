<div class="modal-overlay" id="quickChargeModal">
    <div class="modal-content modal-content-search">
        {% include "includes/modal_header.html" with modal_title="Registrar cobro rápido" %}
        
        <div class="modal-body">
            <div class="quick-search-container">
                {% include "includes/person_search_controls.html" with include_guest=False %}

                <div id="quick-charge-results" class="quick-search-results" data-person-search-results hidden>
                    <!-- Los resultados se cargarán aquí vía JS -->
                </div>
                
                <div id="quick-charge-empty" class="quick-search-empty" data-person-search-empty hidden>
                    No se encontraron resultados.
                </div>

                <div id="quick-charge-loading" class="quick-search-loading" data-person-search-loading hidden>
                    Buscando...
                </div>
            </div>
            <p class="quick-search-help">
                Busque un afiliado, empleado o entrenador para iniciar el cobro.
            </p>
        </div>
    </div>
</div>
