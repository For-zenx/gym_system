<div class="profile-nav-arrows" role="navigation" aria-label="Navegación entre perfiles">
    {% if profile_has_prev %}
    <a href="{{ profile_prev_url }}" class="profile-nav-btn" title="Perfil anterior" aria-label="Perfil anterior">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </a>
    {% else %}
    <span class="profile-nav-btn is-disabled" title="Perfil anterior" aria-label="Perfil anterior" aria-disabled="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </span>
    {% endif %}

    {% if profile_has_next %}
    <a href="{{ profile_next_url }}" class="profile-nav-btn" title="Perfil siguiente" aria-label="Perfil siguiente">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
    </a>
    {% else %}
    <span class="profile-nav-btn is-disabled" title="Perfil siguiente" aria-label="Perfil siguiente" aria-disabled="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
    </span>
    {% endif %}
</div>
