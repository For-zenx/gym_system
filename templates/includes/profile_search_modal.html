<div class="modal-overlay" id="profileSearchModal">
    <div class="modal-content modal-content-search">
        {% include "includes/modal_header.html" with modal_title="Buscar persona" %}

        <div class="modal-body">
            <div class="quick-search-container">
                {% include "includes/person_search_controls.html" with include_guest=True %}

                <div id="profile-search-results" class="quick-search-results" data-person-search-results hidden>
                    <!-- Los resultados se cargarán aquí vía JS -->
                </div>

                <div id="profile-search-empty" class="quick-search-empty" data-person-search-empty hidden>
                    No se encontraron resultados.
                </div>

                <div id="profile-search-loading" class="quick-search-loading" data-person-search-loading hidden>
                    Buscando...
                </div>
            </div>
            <p class="quick-search-help">
                Busque una persona para abrir su perfil.
            </p>
        </div>
    </div>
</div>
